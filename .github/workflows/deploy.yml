name: Deploy

# Deploys to production ONLY after CI has passed on main — this workflow
# never runs its own tests, it trusts ci.yml's result for the same commit.
#
# This workflow is INERT until the secrets below exist in the repo
# (Settings → Secrets and variables → Actions). Every step that needs one
# will simply fail with "secret not set" until then — that is expected and
# safe; nothing here can silently deploy a dev value as if it were
# configured. See docs/DEPLOYMENT.md for exactly how to provision each one.
#
# Required secrets:
#   VPS_HOST          — the Hetzner VPS's public IP or hostname
#   VPS_SSH_USER       — the deploy user on the VPS (not root)
#   VPS_SSH_KEY        — private key matching a public key already in that
#                        user's ~/.ssh/authorized_keys on the VPS
#   CLOUDFLARE_API_TOKEN     — Cloudflare API token scoped to Pages:Edit only
#   CLOUDFLARE_ACCOUNT_ID    — Cloudflare account ID
# No secret is needed to push to GHCR — GITHUB_TOKEN already has that scope
# via the permissions block below.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-api:
    name: Build & push API image
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: echo "image=ghcr.io/${{ github.repository_owner }}/medicart-api:${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: services/api
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/${{ github.repository_owner }}/medicart-api:latest

  deploy-frontend:
    name: Build & deploy frontend to Cloudflare Pages
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build (API base URL baked in at build time)
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: https://api.onetruedose.com
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=onetruedose

  deploy-api:
    name: Deploy API to VPS
    needs: build-and-push-api
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/medicart
            echo "${{ needs.build-and-push-api.outputs.image }}" > .last-deployed-image
            export API_IMAGE="${{ needs.build-and-push-api.outputs.image }}"
            docker compose -f infra/deployment/docker-compose.prod.yml pull api
            docker compose -f infra/deployment/docker-compose.prod.yml up -d api
            sleep 5
            curl -fsS https://api.onetruedose.com/healthz

      # If the health check above fails, the job fails — nothing marks this
      # deploy as successful without a real 200 from the live API. There is
      # deliberately no automated rollback here (see docs/DEPLOYMENT.md's
      # "Rollback" section for the one-command manual rollback instead).
